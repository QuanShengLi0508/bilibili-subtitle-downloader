<!doctype html><meta charset="utf-8"><title>评论读取检查</title>
<!-- Run node tests/serve-comments.cjs, then open http://127.0.0.1:18764/tests/comments_reader.html -->
<script>var module = {exports:{}};</script><script src="../src/comments_reader.js"></script>
<body><script>
const results=[];
const assert=(condition, message)=>{if(!condition)throw new Error(message);};
const reader=module.exports;
const run=(name, test)=>{try{test();results.push(name+'：通过');}catch(error){results.push(name+'：失败 '+error.message);}};
const set=(html)=>{document.body.innerHTML=html;};
const get=(host,path='/note/123')=>reader.extract(document,{hostname:host,href:'https://'+host+path});
run('B站嵌套评论组件与回复',()=>{
  set('<bili-comments></bili-comments>');
  const main=document.querySelector('bili-comments').attachShadow({mode:'open'});
  main.innerHTML='<div id="count">2083</div><bili-comment-thread-renderer></bili-comment-thread-renderer>';
  const thread=main.querySelector('bili-comment-thread-renderer').attachShadow({mode:'open'});
  thread.innerHTML='<bili-comment-renderer id="comment"></bili-comment-renderer><bili-comment-reply-renderer></bili-comment-reply-renderer>';
  const comment=thread.querySelector('bili-comment-renderer').attachShadow({mode:'open'});
  comment.innerHTML='<bili-comment-user-info></bili-comment-user-info><div id="content">置顶<bili-rich-text></bili-rich-text></div><bili-comment-action-buttons-renderer></bili-comment-action-buttons-renderer>';
  comment.querySelector('bili-comment-user-info').attachShadow({mode:'open'}).innerHTML='<div id="user-name">主评论作者</div>';
  comment.querySelector('bili-rich-text').attachShadow({mode:'open'}).innerHTML='<p id="contents">完整正文最后一行</p>';
  comment.querySelector('bili-comment-action-buttons-renderer').attachShadow({mode:'open'}).innerHTML='<div id="pubdate">2026-10-06 10:00</div><div id="like">260</div>';
  thread.querySelector('bili-comment-reply-renderer').attachShadow({mode:'open'}).innerHTML='<div id="user-name">回复作者</div><p id="contents">回复末尾</p><div id="pubdate">2026-10-06 11:00</div><div id="like">18</div>';
  const data=get('www.bilibili.com','/video/BV1test');
  assert(data.comments.length===2,'应该读取主评论和回复');
  assert(data.comments[0].body==='完整正文最后一行','置顶标记不能被当作正文');
  assert(data.comments[1].reply_to==='主评论作者','回复要关联主评论');
  assert(data.total_label==='2083'&&data.comments[0].like_count===260,'总数和点赞数不能混淆');
});
run('抖音完整正文 表情 去除作者标记',()=>{
  set('<main><div>评论(3234)</div><div data-e2e="comment-item"><div><div class="comment-item-info-wrap"><a>作者甲</a><div id="tooltip_123456789"></div></div><div><span>正文末尾<img alt="[捂脸]"></span><div class="comment-item-tag">作者赞过</div></div><div>1周前·陕西</div><div class="comment-item-stats-container"><div><p><span>1.2万</span></p></div></div><div class="replyContainer"><div data-e2e="comment-item"><div class="comment-item-info-wrap"><a>回复乙</a></div><div><span>回复末尾</span></div><div>2天前</div><div class="like-count">6</div></div></div></div></div></main>');
  const data=get('www.douyin.com');
  assert(data.comments.length===2,'主评论与回复数量');
  assert(data.comments[0].body==='正文末尾[捂脸]','正文表情或末尾缺失');
  assert(data.comments[0].like_count===12000,'中文万单位点赞数');
  assert(data.comments[1].reply_to==='作者甲','回复关联丢失');
  assert(data.total_label==='评论(3234)','应显示实际总数');
});
run('小红书评论与楼中楼',()=>{
  set('<div class="comments-container"><div class="total">共 18 条评论</div><div class="comment-item" data-id="x1"><div class="author"><span class="name">小红书作者</span></div><div class="content">主评论最后一段</div><div class="date">2026-10-06</div><div class="like-count">9</div><div class="sub-comment" data-id="x2"><div class="name">回复者</div><div class="content">回复全文末尾</div></div></div></div>');
  const data=get('www.xiaohongshu.com','/explore/123456789012345678901234');
  assert(data.comments.length===2&&data.comments[0].body==='主评论最后一段','不能把楼中楼拼进主评论');
  assert(data.comments[1].reply_to==='小红书作者','回复上下文');
});
run('小红书实际同级回复容器与纯表情',()=>{
  set('<div class="comments-container"><div class="total">共 748 条评论</div><div class="parent-comment"><div id="comment-123" class="comment-item"><div class="author"><a class="name">主评论作者</a></div><div class="content"><span class="note-text">主评论末尾<img class="note-content-emoji"></span></div><div class="date">09-10安徽</div><div class="like"><span class="count">10+</span></div></div><div class="reply-container"><div class="list-container"><div id="comment-456" class="comment-item comment-item-sub"><div class="author"><a class="name">回复作者</a></div><div class="content"><span class="note-text"><img class="note-content-emoji"></span></div><div class="date">1天前湖南</div><div class="like"><span class="count">2</span></div></div></div></div></div></div>');
  const data=get('www.xiaohongshu.com','/explore/123456789012345678901234');
  assert(data.comments.length===2,'容器不能吞掉主评论或表情评论');
  assert(data.comments[0].body==='主评论末尾[表情]','无名称表情不能丢失');
  assert(data.comments[1].body==='[表情]'&&data.comments[1].reply_to==='主评论作者','同级回复应关联主评论');
  assert(data.comments[0].likes==='10+'&&data.comments[0].like_count===10,'保留平台显示的近似赞数');
  assert(data.comments[1].posted_at!==null,'日期含地区时仍可排序');
  assert(data.total_label==='共 748 条评论','总数不能当作已加载数');
});
run('知乎评论区别于答案正文',()=>{
  set('<div class="AnswerItem"><div class="AuthorInfo-name">回答作者</div><div class="RichText">答案正文不得当作评论</div><div class="CommentTopbar-title">12 条评论</div><div class="CommentItemV2"><a class="UserLink-link">评论作者</a><div class="CommentContent">评论完整末尾</div><div class="CommentItemV2-time">昨天 10:00</div><button class="CommentItemV2-likeButton">8</button></div></div>');
  const data=get('www.zhihu.com','/question/123/answer/456');
  assert(data.comments.length===1&&data.comments[0].body==='评论完整末尾','正文与评论要分开');
  assert(data.comments[0].thread==='回答作者','所属回答上下文');
});
run('YouTube 通用ID不去重 回复上下文',()=>{
  set('<ytd-comments-header-renderer><div id="count">100 Comments</div></ytd-comments-header-renderer><ytd-comment-thread-renderer><ytd-comment-view-model id="comment"><a id="author-text">Main Author</a><div id="content-text">First comment end</div><div id="published-time-text">2 days ago</div><div id="vote-count-middle">2K</div></ytd-comment-view-model><ytd-comment-replies-renderer><ytd-comment-view-model id="comment"><a id="author-text">Reply Author</a><div id="content-text">Reply end</div><div id="published-time-text">1 day ago</div><div id="vote-count-middle">0</div></ytd-comment-view-model></ytd-comment-replies-renderer></ytd-comment-thread-renderer>');
  const data=get('www.youtube.com','/watch?v=jNQXAC9IVRw');
  assert(data.comments.length===2,'重复组件ID不能误合并评论');
  assert(data.comments[1].reply_to==='Main Author','回复作者关联');
  assert(data.comments[0].like_count===2000&&data.comments[1].like_count===0,'点赞数字');
});
run('中英文时间 点赞单位 未知时间',()=>{
  const now=Date.parse('2026-10-06T12:00:00+08:00');
  assert(reader.parseTime('2小时前',now)===now-7200000,'中文相对时间');
  assert(reader.parseTime('3 days ago',now)===now-259200000,'英文相对时间');
  assert(reader.parseTime('2026-02-30',now)===null,'非法日期不得猜测');
  assert(reader.parseTime('未知',now)===null,'未知时间');
  assert(reader.parseLikes('1.2万')===12000&&reader.parseLikes('2,001')===2001,'数值转换');
  assert(reader.parseLikes('赞')===null,'未知点赞不能算零');
});
const xArticle=(id,body,extra='',legacy=false)=>`<article ${legacy?'data-testid="tweet"':''}><a href="/User${id}">@User${id}</a><a href="/User${id}/status/${id}" data-base-ui-tooltip-trigger>${legacy?'<time datetime="2026-10-11T01:00:00Z">Oct 11</time>':'2026年10月11日'}</a><div dir="auto" class="whitespace-pre-wrap" ${legacy?'data-testid="tweetText"':''}>${body}</div><div data-engagement-action="like">1.2万</div>${extra}</article>`;
const xRow=(id,body,extra='')=>`<li><div data-timeline-entry data-href="/User${id}/status/${id}">${xArticle(id,body,extra)}</div></li>`;
run('X 当前公开DOM：原帖后同会话、配图条目与推荐截断',()=>{
  set('<main><ul>'+xRow('90','祖先帖不能导出')+xRow('100','原帖不能导出')+xRow('101','第一条会话末尾')+xRow('102','','<a href="/User102/status/102/photo/1">查看媒体</a>')+'<li><h2>Discover more</h2></li>'+xRow('103','推荐不能导出')+'</ul></main><aside>'+xArticle('104','侧边栏推荐不能导出')+'</aside>');
  const data=get('x.com','/User100/status/100');
  assert(data.comments.length===2,'只应保留原帖下推荐区域之前的2条会话');
  assert(data.comments[0].id==='101'&&data.comments[0].body==='第一条会话末尾','原帖不应进入评论');
  assert(data.comments[1].body.includes('仅含图片或视频'),'图片回复必须说明无文字，不能吞掉');
  assert(data.comments[0].like_count===12000&&data.comments[0].posted_at!==null,'赞与绝对时间');
  assert(data.comments.every(c=>c.conversation_source_id==='100'&&c.scope==='loaded-conversation'),'每条关联确切原帖ID');
  assert(data.total_label.includes('不保证均为直接回复'),'不能把串帖说成直接回复');
});
run('X 旧版会话：嵌套引用、原帖与广告排除',()=>{
  set('<main><section role="region" aria-label="Timeline: Conversation">'+xArticle('100','原帖', '', true)+xArticle('101','真正的回复','<div data-testid="quoteTweet">'+xArticle('800','引用帖不可进入回复')+'</div>',true)+'<div data-testid="cellInnerDiv"><span data-testid="promotedIndicator">Ad</span>'+xArticle('102','广告不可导出','',true)+'</div>'+xArticle('103','广告后不自动纳入','',true)+'</section></main>');
  const data=get('twitter.com','/User100/status/100');
  assert(data.comments.length===1&&data.comments[0].id==='101','引用和广告必须排除');
  assert(data.comments[0].body==='真正的回复','不能把引用正文拼进回复');
  assert(data.comments[0].posted_at===Date.parse('2026-10-11T01:00:00Z'),'使用datetime完整时间');
});
run('X 确切状态ID、缺失原帖、登录与不可用不会报零评论',()=>{
  assert(reader.xStatus('https://twitter.com/u/status/100/photo/1')==='100','媒体分享链接ID');
  assert(reader.xStatus('https://x.com/i/web/status/100')==='100','旧状态路由');
  assert(reader.xStatus('https://x.com.evil.test/u/status/100')===null,'拒绝伪造来源');
  const error=(html,path,code)=>{set(html);try{get('x.com',path);throw new Error('错误地接受了页面');}catch(e){assert(e.code===code,e.message);}};
  error('<main><ul>'+xRow('200','其他帖子')+'</ul></main>','/u/status/100','changed_post');
  error('<main>Log in to X</main>','/i/flow/login','login_required');
  error('<main>唔...该页面不存在。请尝试搜索别的内容。</main>','/u/status/100','unavailable');
  error('<main><ul>'+xRow('100','原帖')+xRow('101','折叠部分','<button>Show more</button>')+'</ul></main>','/u/status/100','not_loaded');
});
document.body.innerHTML='<h1>评论读取检查</h1>'+results.map(r=>'<p>'+r+'</p>').join('');
document.title=results.some(r=>r.includes('失败'))?'评论检查失败':'评论检查全部通过';
</script>
