[package]
name = "bili-subtitle-downloader"
version = "1.6.3"
edition = "2021"
default-run = "bili-subtitle-downloader"
description = "拾文：字幕提取、视频下载与音视频转文字"

[dependencies]
eframe = "0.29"
rfd = "0.15"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls", "cookies", "system-proxy"], default-features = false }
serde_json = "1"
anyhow = "1"
md5 = "0.7"
qrcode = "0.14"
reqwest_cookie_store = "0.8"
cookie_store = "0.21"
html2text = "0.17.1"
zhihu_sign = "0.1.0"
docx-rs = "0.4"
printpdf = { version = "0.7", default-features = false, features = ["font_subsetting"] }
tempfile = "3"
ttf-parser = "0.19"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
lopdf = { version = "0.31", default-features = false, features = ["nom_parser"] }

[target.'cfg(windows)'.dependencies]
wry = "0.57"
winit = "0.30"
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_Foundation"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
