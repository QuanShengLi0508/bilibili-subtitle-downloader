[package]
name = "bili-subtitle-downloader"
version = "1.3.0"
edition = "2021"
description = "输入B站链接下载字幕的桌面应用"

[dependencies]
eframe = "0.29"
rfd = "0.15"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls", "cookies"], default-features = false }
serde_json = "1"
anyhow = "1"
md5 = "0.7"
qrcode = "0.14"
reqwest_cookie_store = "0.8"
cookie_store = "0.21"
arboard = "3.6.1"
webbrowser = "1.2.4"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
