name: shiwen_mobile
description: 拾文：手机独立提取字幕、知乎文字与音视频转写
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.0
  crypto: ^3.0.6
  html: ^0.15.6
  archive: ^4.0.7
  pdf: ^3.11.3
  path_provider: ^2.1.5
  path: ^1.9.1
  file_picker: ^13.1.0
  open_filex: ^4.7.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.3
  flutter_inappwebview: ^6.1.5
  whisper_flutter_new:
    path: vendor/whisper_flutter_new
  ffmpeg_kit_flutter_new_min: ^3.6.2
dev_dependencies:
  path_provider_platform_interface: ^2.1.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/ggml-base.bin
    - assets/NotoSansSC.ttf
    - assets/NotoSansSC-OFL.txt

